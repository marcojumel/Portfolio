<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marco Jumel — Photographer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="cover">

        <img 
            class="cover-image" 
            src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2000"
            alt="Cover photograph"
        >

        <div class="cover-overlay"></div>

        <div class="name">
            <span>MARCO</span>
            <span>JUMEL</span>
        </div>

        <div class="introduction">
            <p>
                Mauvais dessinateur,<br>
                je n'ai que mon appareil<br>
                pour peindre ce que je vois.
            </p>
        </div>

        <div class="enter">
            <span>SCROLL TO ENTER</span>
            <span class="arrow">↓</span>
        </div>

    </main>

    <section class="intro-page">

        <p class="section-number">01</p>

        <h1>OBSERVE</h1>

        <p class="intro-text">
            Street photography, travel and visual stories.
        </p>

    </section>

    <script src="script.js"></script>

</html>
